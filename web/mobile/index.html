<!DOCTYPE html>
<html lang="en" data-app="mobile">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#0e0e11">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="PiCode">
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<title>PiCode</title>
<script>
/* Theme bootstrap — runs before CSS to avoid flash of wrong theme. */
(function () {
  var mode = "system";
  try { mode = localStorage.getItem("picode-theme") || mode; } catch {}
  var q = new URLSearchParams(location.search).get("theme");
  if (q === "light" || q === "dark" || q === "system") { mode = q; try { localStorage.setItem("picode-theme", q); } catch {} }
  var dark = mode === "dark" || (mode === "system" && matchMedia("(prefers-color-scheme: dark)").matches);
  document.documentElement.dataset.theme = dark ? "dark" : "light";
  document.documentElement.style.colorScheme = dark ? "dark" : "light";
  /* iOS standalone (Add to Home Screen) letterboxes a bottom strip outside
     the layout viewport on current iOS (WebKit 313800/254868): env(bottom)
     is double-counted there and CSS can only paint the canvas. The behavior
     tracks the iOS generation AND when the icon was added (WebKit 317153:
     pre-27-beta icons keep true edge-to-edge, fresh installs letterbox, some
     report env 0) — so measure, don't assume: flag only when the visual
     viewport is really shorter than the screen. navigator.standalone is
     iOS-only, so Android/Chrome standalone keeps real env() insets. */
  if (navigator.standalone === true && window.innerWidth < window.innerHeight) {
    var vvH = (window.visualViewport && window.visualViewport.height) || window.innerHeight;
    if (window.screen.height - vvH > 24) document.documentElement.dataset.standalone = "1";
    if (new URLSearchParams(location.search).has("strip-probe")) {
      document.documentElement.dataset.stripProbe = "1"; /* experimental: see mobile.css */
    }
  }
})();
</script>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
