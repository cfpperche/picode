# Prose lint for the public docs — the gate lives in `make ci`.
# Philosophy: errors are typos and consistency breaks (spelling, repeated
# words); anything stylistic stays out so the gate never teaches agents
# to fear prose. Everything is in-repo (styles/) — no network packages.
# The make target passes explicit paths (www/*.md www/guide/*.md) so
# vendored trees (www/node_modules) are never scanned.
StylesPath = styles
MinAlertLevel = error
Vocab = PiCode

[*.{md}]
BasedOnStyles = PiCode
