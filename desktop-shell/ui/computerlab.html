<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Computer lab</title>
<style>
  /* The Computer lab (ADR-0148, M1): drive the computer tool's commands by
     hand and see what the model would see. A spike page — function over
     polish, dark like the shell. */
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    display: grid; grid-template-columns: 340px 1fr; height: 100%;
    background: #0e0e11; color: #e7e7ea;
    font: 13px/1.35 "Segoe UI", system-ui, sans-serif;
  }
  aside { padding: 10px; overflow: auto; border-right: 1px solid #222; display: flex; flex-direction: column; gap: 8px; }
  main { position: relative; overflow: auto; padding: 10px; }
  fieldset { border: 1px solid #2e2e33; border-radius: 6px; padding: 8px; margin: 0; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  legend { color: #9a9aa3; padding: 0 4px; }
  button, select, input[type=text], input[type=number] {
    height: 28px; padding: 0 8px; border: 1px solid #2e2e33; border-radius: 6px;
    background: #1a1a1f; color: inherit; font: inherit;
  }
  button { cursor: pointer; }
  button:hover { border-color: #4c4c55; }
  input[type=text] { flex: 1; min-width: 80px; }
  input[type=number] { width: 64px; }
  select { max-width: 100%; }
  #shot-wrap { position: relative; display: inline-block; }
  #shot { display: block; max-width: 100%; border: 1px solid #2e2e33; cursor: crosshair; }
  #overlay { position: absolute; left: 0; top: 0; pointer-events: none; }
  #meta { font: 11px/1.4 Consolas, monospace; color: #9a9aa3; white-space: pre-wrap; margin-top: 6px; }
  #log { font: 11px/1.4 Consolas, monospace; white-space: pre-wrap; background: #121216; border: 1px solid #222; padding: 6px; border-radius: 6px; max-height: 220px; overflow: auto; }
  #snap { font: 11px/1.4 Consolas, monospace; white-space: pre; background: #121216; border: 1px solid #222; padding: 6px; border-radius: 6px; max-height: 260px; overflow: auto; }
  .err { color: #f0a0a0; }
  .ok { color: #9ad29a; }
  small { color: #6f6f78; }
</style>
</head>
<body>
<aside>
  <fieldset>
    <legend>Target</legend>
    <button id="refresh">Refresh displays &amp; windows</button>
    <select id="display"></select>
    <select id="window"><option value="">— window: none (the display) —</option></select>
    <button id="focus">Focus window</button>
    <button id="embed" title="Spike: SetParent the window into PiCode's right half">Embed into PiCode</button>
    <button id="unembed">Unembed</button>
  </fieldset>
  <fieldset>
    <legend>See</legend>
    <button id="screenshot">Screenshot</button>
    <button id="snapshot">Snapshot (UIA)</button>
    <button id="cursor">Cursor position</button>
    <button id="wait">Wait 1 s</button>
    <small>Click the image to left-click there. Drag on the image to zoom into a region. Clicks land on the real screen, so keep this lab on another monitor, or pick a window target.</small>
  </fieldset>
  <fieldset>
    <legend>Act</legend>
    <input type="text" id="typetext" placeholder="text to type">
    <button id="type">Type</button>
    <input type="text" id="keytext" placeholder="key chord, e.g. ctrl+a, Return">
    <button id="key">Key</button>
    <button id="scrollup">Scroll up</button>
    <button id="scrolldown">Scroll down</button>
    <button id="rightclick">Right-click at last point</button>
    <button id="doubleclick">Double-click at last point</button>
  </fieldset>
  <fieldset>
    <legend>Clipboard &amp; open</legend>
    <button id="clipread">Read clipboard</button>
    <input type="text" id="cliptext" placeholder="text to put on the clipboard">
    <button id="clipwrite">Write</button>
    <input type="text" id="opentarget" placeholder="notepad.exe, a path or a URL">
    <button id="open">Open</button>
  </fieldset>
  <fieldset>
    <legend>Log</legend>
    <div id="log"></div>
  </fieldset>
</aside>
<main>
  <div id="shot-wrap">
    <img id="shot" alt="">
    <canvas id="overlay"></canvas>
  </div>
  <div id="meta">No image yet. Refresh, pick a target, take a screenshot.</div>
  <pre id="snap"></pre>
</main>
<script>
  const inv = window.__TAURI__.core.invoke;
  const $ = (id) => document.getElementById(id);
  const PRINCIPAL = "lab";
  let lastPoint = null;      // image coordinates of the last click
  let lastMeta = null;
  let dragStart = null;

  function log(msg, cls) {
    const line = document.createElement("div");
    line.textContent = new Date().toLocaleTimeString() + "  " + msg;
    if (cls) line.className = cls;
    $("log").prepend(line);
  }
  function call(action, params) {
    return inv("computer_call", { principal: PRINCIPAL, action, paramsJson: JSON.stringify(params || {}) })
      .then((r) => { log(action + " ok" + (r && r.meta && r.meta.ms != null ? " (" + r.meta.ms + " ms)" : ""), "ok"); show(r); return r; })
      .catch((e) => { log(action + ": " + e, "err"); throw e; });
  }
  function target() {
    const w = $("window").value;
    if (w) return { window: Number(w) };
    return { display: Number($("display").value || 1) };
  }
  function show(r) {
    if (!r) return;
    if (r.image) {
      $("shot").src = "data:" + (r.mime || "image/png") + ";base64," + r.image;
      lastMeta = r.meta;
      const m = r.meta || {};
      $("meta").textContent =
        `image ${m.width}×${m.height}  scale ${m.scale}  bounds ${JSON.stringify(m.bounds)}  display ${m.display}` +
        `  seq ${m.seq}  cursor(in image) ${JSON.stringify(m.cursor)}  ${m.ms} ms` +
        (m.window ? `\nwindow ${m.window.exe} "${m.window.title}" id=${m.window.id}` : "");
      requestAnimationFrame(drawOverlay);
    }
    if (r.lines) {
      $("snap").textContent = r.lines.join("\n") + (r.dropped ? `\n… ${r.dropped} more node(s) not shown` : "") + `\n(${r.nodes} nodes walked)`;
    }
    if (r.text != null && r.coordinate === undefined && !r.lines) $("snap").textContent = r.text;
    if (r.coordinate !== undefined) $("meta").textContent += `\ncursor_position → ${JSON.stringify(r.coordinate)} outside=${r.outside} screen=${JSON.stringify(r.screen)}`;
  }
  // The crosshair goes where the page THINKS the click landed (lastPoint) in
  // image space, and a second mark where the desk says the OS cursor is
  // (meta.cursor). When the two coincide, the mapping is right.
  function drawOverlay() {
    const img = $("shot"), c = $("overlay");
    c.width = img.clientWidth; c.height = img.clientHeight;
    c.style.width = img.clientWidth + "px"; c.style.height = img.clientHeight + "px";
    const ctx = c.getContext("2d");
    ctx.clearRect(0, 0, c.width, c.height);
    if (!img.naturalWidth) return;
    const sx = img.clientWidth / img.naturalWidth, sy = img.clientHeight / img.naturalHeight;
    if (lastPoint) {
      ctx.strokeStyle = "#ff4d4d"; ctx.lineWidth = 1;
      const x = lastPoint[0] * sx, y = lastPoint[1] * sy;
      ctx.beginPath(); ctx.moveTo(x - 12, y); ctx.lineTo(x + 12, y); ctx.moveTo(x, y - 12); ctx.lineTo(x, y + 12); ctx.stroke();
    }
    if (lastMeta && lastMeta.cursor) {
      ctx.strokeStyle = "#4dff88";
      const x = lastMeta.cursor[0] * sx, y = lastMeta.cursor[1] * sy;
      ctx.beginPath(); ctx.arc(x, y, 8, 0, Math.PI * 2); ctx.stroke();
    }
  }
  function imagePoint(ev) {
    const img = $("shot");
    const r = img.getBoundingClientRect();
    const x = Math.floor((ev.clientX - r.left) * img.naturalWidth / r.width);
    const y = Math.floor((ev.clientY - r.top) * img.naturalHeight / r.height);
    return [x, y];
  }
  function refresh() {
    inv("computer_windows").then((r) => {
      const d = $("display"); d.innerHTML = "";
      (r.displays || []).forEach((x) => {
        const o = document.createElement("option"); o.value = x.index;
        o.textContent = `display ${x.index}${x.primary ? " (primary)" : ""} ${x.right - x.left}×${x.bottom - x.top} @${x.left},${x.top} dpi ${x.dpi}`;
        d.appendChild(o);
      });
      const w = $("window"); const keep = w.value; w.innerHTML = '<option value="">— window: none (the display) —</option>';
      (r.windows || []).forEach((x) => {
        const o = document.createElement("option"); o.value = x.id;
        o.textContent = `${x.exe} "${x.title.slice(0, 48)}" d${x.display}${x.foreground ? " [front]" : ""}${x.minimized ? " [min]" : ""}`;
        w.appendChild(o);
      });
      w.value = keep;
      log(`${(r.displays || []).length} display(s), ${(r.windows || []).length} window(s)`, "ok");
    }).catch((e) => log("windows: " + e, "err"));
  }

  $("refresh").onclick = refresh;
  $("screenshot").onclick = () => call("screenshot", target());
  $("snapshot").onclick = () => { const w = $("window").value; call("snapshot", w ? { window: Number(w) } : {}); };
  $("cursor").onclick = () => call("cursor_position", {});
  $("wait").onclick = () => call("wait", { duration: 1 });
  $("focus").onclick = () => { const w = $("window").value; if (!w) return log("pick a window first", "err"); call("focus", { window: Number(w) }); };
  // Spike (2026-09-18): host the window inside PiCode's main window and
  // measure what breaks. Always unembed before closing PiCode.
  $("embed").onclick = () => { const w = $("window").value; if (!w) return log("pick a window first", "err"); inv("computer_embed", { window: Number(w) }).then((r) => log("embed ok " + JSON.stringify(r), "ok")).catch((e) => log("embed: " + e, "err")); };
  $("unembed").onclick = () => { const w = $("window").value; if (!w) return log("pick a window first", "err"); inv("computer_unembed", { window: Number(w) }).then((r) => log("unembed ok " + JSON.stringify(r), "ok")).catch((e) => log("unembed: " + e, "err")); };
  $("type").onclick = () => call("type", { text: $("typetext").value });
  $("key").onclick = () => call("key", { text: $("keytext").value });
  $("scrollup").onclick = () => call("scroll", { coordinate: lastPoint, scroll_direction: "up", scroll_amount: 3 });
  $("scrolldown").onclick = () => call("scroll", { coordinate: lastPoint, scroll_direction: "down", scroll_amount: 3 });
  $("rightclick").onclick = () => call("right_click", { coordinate: lastPoint });
  $("doubleclick").onclick = () => call("double_click", { coordinate: lastPoint });
  $("clipread").onclick = () => call("clipboard_read", {}).then((r) => log("clipboard: " + JSON.stringify(r.text).slice(0, 200)));
  $("clipwrite").onclick = () => call("clipboard_write", { text: $("cliptext").value });
  $("open").onclick = () => call("open", { target: $("opentarget").value });

  const shot = $("shot");
  shot.addEventListener("mousedown", (ev) => { dragStart = imagePoint(ev); });
  shot.addEventListener("mouseup", (ev) => {
    const end = imagePoint(ev);
    const start = dragStart; dragStart = null;
    if (start && (Math.abs(end[0] - start[0]) > 6 || Math.abs(end[1] - start[1]) > 6)) {
      call("zoom", { region: [start[0], start[1], end[0], end[1]] });
      return;
    }
    lastPoint = end;
    log(`left_click at image ${JSON.stringify(end)}`);
    call("left_click", { coordinate: end });
  });
  window.addEventListener("resize", drawOverlay);
  shot.addEventListener("load", drawOverlay);

  inv("computer_set_grants", { keys: [PRINCIPAL] }).then(refresh).catch((e) => log("grants: " + e, "err"));
</script>
</body>
</html>
