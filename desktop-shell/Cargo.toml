[package]
name = "picode-shell"
version = "0.1.0"
description = "PiCode Desktop v2 shell — the work application window"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "devtools", "unstable"] }
tauri-plugin-single-instance = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
webview2-com = "0.38"
windows = { version = "0.61", features = ["Win32_UI_Shell", "Win32_System_Com", "Win32_Storage_FileSystem", "Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading"] }


[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
