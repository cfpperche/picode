[package]
name = "picode-shell"
version = "0.1.0"
description = "PiCode Desktop v2 shell — the work application window"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "devtools", "unstable"] }
tauri-plugin-single-instance = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
webview2-com = "0.38"
windows = { version = "0.61", features = [
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
  "Win32_System_Com",
  "Win32_Storage_FileSystem",
  "Win32_Foundation",
  "Win32_Security",
  "Win32_System_JobObjects",
  "Win32_System_Threading",
  # The computer tool's actuator (ADR-0148): capture, input, UI Automation,
  # clipboard — bindings the crate already ships, no new dependency.
  "Win32_Graphics_Gdi",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Imaging",
  "Win32_Storage_Xps",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_DataExchange",
  "Win32_System_Memory",
  "Win32_System_Variant",
  "Win32_System_Ole",
  "Win32_UI_Accessibility",
  "Win32_UI_HiDpi",
  "Win32_UI_Input_KeyboardAndMouse",
] }


[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true

# Isolated native UI acceptance; excluded from the installed resident build.
[features]
overlay-qa = []

[[example]]
name = "overlay_product_qa"
path = "src/main.rs"
required-features = ["overlay-qa"]
