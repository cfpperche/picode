name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    name: Go (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install tmux (integration tests)
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y tmux
      - uses: actions/setup-go@v5
        with:
          # Not 'go-version-file': macOS arm64 runners hit golang/go#67629
          # (missing LC_UUID) with -race on old toolchains; go.mod stays at
          # the minimum (1.22), CI builds with a current stable toolchain.
          go-version: "stable"
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build UI
        run: make web

      - name: Frontend tests
        run: make test-js

      - name: Public docs
        if: matrix.os == 'ubuntu-latest'
        run: make docs

      - name: Format check
        if: matrix.os == 'ubuntu-latest'
        run: make fmt-check

      # The worktree guards (AGENTS.md §5) are shell + git, so nothing else in
      # this matrix would notice an edit that made them block every worktree,
      # or stop blocking anything. Runs on a throwaway repo, never on the
      # checkout. Linux only: it reads /proc for the invoking command.
      - name: Git guard self-test
        if: matrix.os == 'ubuntu-latest'
        run: ./scripts/hooks-selftest.sh

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race ./...

      - name: Build
        run: go build -tags embedui -o bin/picode ./cmd/picode
