name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Ubuntu 24.04 packages tmux 3.4 and PiCode's extended-keys-format contract
# starts at 3.5, so the daemon suites build the declared minimum. The version
# and its checksum live here so the two jobs that need it cannot drift apart.
env:
  TMUX_MIN: "3.5a"
  TMUX_MIN_SHA: 16216bd0877170dfcc64157085ba9013610b12b082548c7c9542cc0103198951

jobs:
  changes:
    name: Classify changes
    runs-on: ubuntu-latest
    outputs:
      full: ${{ steps.scope.outputs.full }}
      docs: ${{ steps.scope.outputs.docs }}
      desktop: ${{ steps.scope.outputs.desktop }}
      os: ${{ steps.os.outputs.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          # Pull-request bases and push "before" commits must both be present.
          fetch-depth: 0

      # Whitespace errors are refused by the local pre-commit hook (ADR-0105);
      # the check that lived here failed whole runs that nobody read.

      - name: Select required gates
        id: scope
        env:
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          CI_HEAD_SHA: ${{ github.sha }}
        run: node scripts/ci-scope.mjs

      # The daemon suite runs on Linux for every push. The macOS leg joins it
      # when the diff touches a path where macOS has actually broken before
      # (`macosRelevant` in scripts/ci-scope.mjs: sockets and process
      # inspection in internal/tmux and internal/server, path resolution in
      # internal/clicreds and internal/clipkgs, the workflow and that script),
      # and Windows stays for tags and manual runs: it compiles rather than
      # executes the daemon (ADR-0020).
      #
      # Amended 2026-09-23, ADR-0105: the legs were cut down to tags and
      # manual runs because they were red for infrastructure reasons and
      # unread — those defects are fixed, and the last one (two macOS test
      # bugs) was found only by a manual run, i.e. exactly the late discovery
      # the ADR's own text names as the cost. The leg still does not run for
      # every push: a macOS runner costs several times a Linux one, so it is
      # bought where the history says it earns its keep.
      - name: Select operating systems
        id: os
        shell: bash
        run: |
          # Ubuntu always; macOS when the diff can break it (see above);
          # Windows only for a tag or a manual run — it compiles rather than
          # executes the daemon (ADR-0020), so a per-push leg would buy little.
          # The three are built one at a time because a macOS-relevant push
          # must not quietly buy a Windows runner too.
          os='"ubuntu-latest"'
          if [[ "$GITHUB_REF" == refs/tags/* || "$GITHUB_EVENT_NAME" == workflow_dispatch || "${{ steps.scope.outputs.macos }}" == "true" ]]; then
            os="$os,\"macos-latest\""
          fi
          if [[ "$GITHUB_REF" == refs/tags/* || "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            os="$os,\"windows-latest\""
          fi
          echo "os=[$os]" >> "$GITHUB_OUTPUT"

  frontend:
    name: Frontend
    needs: changes
    if: needs.changes.outputs.full == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      # Build and test the platform-independent UI once. The old OS matrix
      # repeated this 526 MB install on every runner; Windows alone spent up to
      # seven minutes extracting the same packages.
      - name: Build UI
        run: make web
      - name: Frontend and package tests
        run: make test-js
      - name: Upload embedded UI
        uses: actions/upload-artifact@v7
        with:
          name: picode-ui
          path: internal/web/public/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 1
          compression-level: 1

  docs:
    name: Public docs
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "stable"
          cache: true
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: docs-site/package-lock.json

      # Check committed parity before `make docs` regenerates OpenAPI (llms.txt
      # is generated by the build and is not committed — ADR-0125).
      # Tutorial videos get a hash-only integrity check here; capture/render and
      # the strict UI-tree freshness audit are explicit maintenance commands.
      - name: Docs parity
        run: make docs-check
      - name: Build public docs
        run: make docs
      - name: Prose lint (Vale)
        run: make vale

  go:
    name: Go (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.full == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.changes.outputs.os) }}
    steps:
      - uses: actions/checkout@v7

      # Ubuntu 24.04 packages tmux 3.4, but PiCode's extended-keys-format
      # contract starts at 3.5. Test the declared minimum instead of silently
      # skipping that integration path. The release tarball is checksum-pinned;
      # the built tree is cached so the compile runs once per runner image.
      - name: Cache the tmux ${{ env.TMUX_MIN }} build
        if: matrix.os == 'ubuntu-latest'
        id: tmux-cache
        uses: actions/cache@v4
        with:
          path: /tmp/tmux-${{ env.TMUX_MIN }}
          key: tmux-${{ env.TMUX_MIN }}-${{ runner.os }}-${{ runner.arch }}-v1
      - name: Build tmux ${{ env.TMUX_MIN }}
        if: matrix.os == 'ubuntu-latest' && steps.tmux-cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y bison libevent-dev libncurses-dev
          curl -fsSL --retry 3 \
            https://github.com/tmux/tmux/releases/download/$TMUX_MIN/tmux-$TMUX_MIN.tar.gz \
            -o /tmp/tmux-$TMUX_MIN.tar.gz
          echo "$TMUX_MIN_SHA  /tmp/tmux-$TMUX_MIN.tar.gz" | sha256sum -c -
          tar -xzf /tmp/tmux-$TMUX_MIN.tar.gz -C /tmp
          cd /tmp/tmux-$TMUX_MIN
          ./configure
          make -j2
      - name: Install tmux ${{ env.TMUX_MIN }} (integration tests)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libevent-dev libncurses-dev
          cd /tmp/tmux-$TMUX_MIN && sudo make install
          test "$(tmux -V)" = "tmux $TMUX_MIN"

      # The daemon runs on macOS too; Homebrew's tmux satisfies the >= 3.5
      # contract, so the handoff and terminal suites run for real there
      # instead of answering 503 "Install tmux" (2026-09-09).
      - name: Install tmux (macOS)
        if: matrix.os == 'macos-latest'
        run: brew install tmux && tmux -V

      # The suites start tmux from several packages at once on a fresh runner;
      # two clients racing to start the first server leave one of them with
      # "server exited unexpectedly" (TestBridgeResizeControl, 2026-09-09).
      # A detached session keeps one server alive for the whole run — the
      # state every developer machine is already in.
      - name: Keep a tmux server alive for the daemon suite
        if: matrix.os != 'windows-latest'
        run: tmux new-session -d -s ci-keepalive && tmux list-sessions

      - uses: actions/setup-go@v7
        with:
          # Not 'go-version-file': macOS arm64 runners hit golang/go#67629
          # (missing LC_UUID) with -race on old toolchains; go.mod stays at
          # the minimum (1.22), CI builds with a current stable toolchain.
          go-version: "stable"
          cache: true

      - name: Format check
        if: matrix.os == 'ubuntu-latest'
        run: make fmt-check

      # The worktree guards read /proc, so this policy matrix runs on Linux.
      - name: Git guard self-test
        if: matrix.os == 'ubuntu-latest'
        run: ./scripts/hooks-selftest.sh

      - name: Vet
        run: go vet ./...

      # The daemon runs on Linux/macOS (inside WSL on Windows). Windows still
      # compiles every package and test with the race toolchain, then executes
      # the native tray/native-host boundary. Running the Linux daemon suite
      # against Windows path and permission semantics tests an unsupported
      # topology rather than the shipped Windows product (ADR-0020).
      # The race detector puts a package this size past `go test`'s 10-minute
      # default, so the timeout is raised rather than left to kill the gate.
      #
      # This step covers every package except the two in the `go-heavy` job
      # below (2026-09-24, owner approved), so its ceiling is its own: a slow
      # package can no longer push the rest of the suite past a shared
      # timeout — the run of 2026-09-22 died as `FAIL internal/server
      # 1800.070s` with no failing test to read, and the measurements behind
      # that are in docs/handoff/open/process.md.
      #
      # Sharding is off here on purpose, after trying it: a hosted runner has
      # two cores, so four shards of a CPU-bound package buy no wall clock —
      # and the extra concurrent processes each start their own tmux server,
      # which is what broke internal/tmux on ubuntu the run after sharding
      # landed. `make ci` still shards locally, where there are cores to
      # spend.
      #
      # 35m, not 25m: the first run of this split measured 7 minutes for these
      # packages on ubuntu, and the macOS half of the same run never got the
      # exclusion (a BSD `paste` in the script made the pattern empty) — so
      # the macOS figure is still unmeasured, and the ceiling is sized for a
      # slower runner rather than for the ubuntu number.
      - name: Test daemon
        if: matrix.os != 'windows-latest'
        run: GO_TEST_EXCLUDE_HEAVY=1 GO_TEST_SHARDS=1 GO_TEST_FLAGS="-race -timeout 35m" ./scripts/go-test.sh ./...

      - name: Compile Windows packages and tests
        if: matrix.os == 'windows-latest'
        run: go test -race -run '^$' ./...

      - name: Test Windows host boundary
        if: matrix.os == 'windows-latest'
        run: go test -race ./cmd/picode ./cmd/picode-desktop ./internal/binwatch ./internal/browserhost ./internal/desktop ./internal/osopen ./internal/version

  # The two heavy packages in a job of their own (2026-09-24, owner approved).
  # internal/server and internal/store are ~26 minutes of `-race` on a
  # two-core runner: 365 serial tests by design (ADR-0086) plus launch tests
  # that spawn real terminals (ADR-0184). Sharing a job with the other ~300
  # packages gave them one shared ceiling and one shared verdict. Here their
  # ceiling is theirs, the rest of the suite gets a runner of its own, and a
  # red check says which half failed. Sharding stays off for the reason
  # measured next door: two cores buy nothing from four shards.
  go-heavy:
    name: Go heavy (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.full == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # The same list the go job consumes, so the heavy suite runs on
        # exactly the platforms everything else does — the macOS defects
        # this leg exists to catch live in internal/server.
        os: ${{ fromJSON(needs.changes.outputs.os) }}
    steps:
      - uses: actions/checkout@v7

      # Mirrors the go job's setup: the heavy suite is the one that drives
      # real terminals, so it needs a real tmux ${{ env.TMUX_MIN }} just as much.
      - name: Cache the tmux ${{ env.TMUX_MIN }} build
        if: matrix.os == 'ubuntu-latest'
        id: tmux-cache
        uses: actions/cache@v4
        with:
          path: /tmp/tmux-${{ env.TMUX_MIN }}
          key: tmux-${{ env.TMUX_MIN }}-${{ runner.os }}-${{ runner.arch }}-v1
      - name: Build tmux ${{ env.TMUX_MIN }}
        if: matrix.os == 'ubuntu-latest' && steps.tmux-cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y bison libevent-dev libncurses-dev
          curl -fsSL --retry 3 \
            https://github.com/tmux/tmux/releases/download/$TMUX_MIN/tmux-$TMUX_MIN.tar.gz \
            -o /tmp/tmux-$TMUX_MIN.tar.gz
          echo "$TMUX_MIN_SHA  /tmp/tmux-$TMUX_MIN.tar.gz" | sha256sum -c -
          tar -xzf /tmp/tmux-$TMUX_MIN.tar.gz -C /tmp
          cd /tmp/tmux-$TMUX_MIN
          ./configure
          make -j2
      - name: Install tmux ${{ env.TMUX_MIN }} (integration tests)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libevent-dev libncurses-dev
          cd /tmp/tmux-$TMUX_MIN && sudo make install
          test "$(tmux -V)" = "tmux $TMUX_MIN"
      - name: Install tmux (macOS)
        if: matrix.os == 'macos-latest'
        run: brew install tmux && tmux -V
      - name: Keep a tmux server alive for the daemon suite
        if: matrix.os != 'windows-latest'
        run: tmux new-session -d -s ci-keepalive && tmux list-sessions

      - uses: actions/setup-go@v7
        with:
          go-version: "stable"
          cache: true

      # Windows compiles every package and test in the go job and executes
      # its native boundary there; the daemon suites do not run on Windows
      # (ADR-0020), so this job's Windows leg is a compile-only no-op that
      # still reports success.
      - name: Test the heavy packages
        if: matrix.os != 'windows-latest'
        run: GO_TEST_SHARDS=1 GO_TEST_FLAGS="-race -timeout 40m" ./scripts/go-test.sh ./internal/server ./internal/store

  embedded:
    name: Embedded UI build
    needs: [changes, frontend]
    if: needs.changes.outputs.full == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "stable"
          cache: true
      - name: Download embedded UI
        uses: actions/download-artifact@v8
        with:
          name: picode-ui
          path: internal/web/public
      - name: Test and build embedded UI
        run: |
          test -f internal/web/public/index.html
          test -f internal/web/public/desktop/index.html
          test -f internal/web/public/mobile/index.html
          go test -tags embedui ./internal/web
          mkdir -p bin
          go build -tags embedui -o bin/picode ./cmd/picode

  # The shell's pure half host-tests with plain rustc (no Windows toolchain).
  # The COM half never compiles here — cargo xwin runs in the scoped local
  # gates and at release; that residual is recorded in
  # docs/handoff/open/desktop-shell-gates.md.
  desktop:
    name: Shell (host tests)
    needs: changes
    if: needs.changes.outputs.full == 'true' || needs.changes.outputs.desktop == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Pure shell modules' host tests
        run: make desktop-test

  gate:
    name: CI gate
    if: always()
    needs: [changes, frontend, docs, go, go-heavy, embedded, desktop]
    runs-on: ubuntu-latest
    steps:
      - name: Require every applicable gate
        shell: bash
        env:
          CHANGES: ${{ needs.changes.result }}
          FRONTEND: ${{ needs.frontend.result }}
          DOCS: ${{ needs.docs.result }}
          GO: ${{ needs.go.result }}
          GO_HEAVY: ${{ needs.go-heavy.result }}
          EMBEDDED: ${{ needs.embedded.result }}
          DESKTOP: ${{ needs.desktop.result }}
        run: |
          failed=0
          for gate in CHANGES FRONTEND DOCS GO GO_HEAVY EMBEDDED DESKTOP; do
            result="${!gate}"
            printf '%-10s %s\n' "$gate" "$result"
            case "$result" in
              success|skipped) ;;
              *) failed=1 ;;
            esac
          done
          exit "$failed"
