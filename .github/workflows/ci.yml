name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    name: Go (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install tmux (integration tests)
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y tmux
      - uses: actions/setup-go@v5
        with:
          # Not 'go-version-file': macOS arm64 runners hit golang/go#67629
          # (missing LC_UUID) with -race on old toolchains; go.mod stays at
          # the minimum (1.22), CI builds with a current stable toolchain.
          go-version: "stable"
          cache: true

      - name: Format check
        if: matrix.os == 'ubuntu-latest'
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race ./...

      - name: Build
        run: go build -o bin/picode ./cmd/picode
