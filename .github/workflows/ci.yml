name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Classify changes
    runs-on: ubuntu-latest
    outputs:
      full: ${{ steps.scope.outputs.full }}
      docs: ${{ steps.scope.outputs.docs }}
      os: ${{ steps.os.outputs.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          # Pull-request bases and push "before" commits must both be present.
          fetch-depth: 0

      # Whitespace errors are refused by the local pre-commit hook (ADR-0105);
      # the check that lived here failed whole runs that nobody read.

      # The daemon suite runs on Linux for every push; the macOS and Windows
      # legs only for a tag or a manual run (ADR-0105) — they were red for
      # infrastructure reasons and unread for days.
      - name: Select operating systems
        id: os
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* || "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            echo 'os=["ubuntu-latest","macos-latest","windows-latest"]' >> "$GITHUB_OUTPUT"
          else
            echo 'os=["ubuntu-latest"]' >> "$GITHUB_OUTPUT"
          fi

      - name: Select required gates
        id: scope
        env:
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          CI_HEAD_SHA: ${{ github.sha }}
        run: node scripts/ci-scope.mjs

  frontend:
    name: Frontend
    needs: changes
    if: needs.changes.outputs.full == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      # Build and test the platform-independent UI once. The old OS matrix
      # repeated this 526 MB install on every runner; Windows alone spent up to
      # seven minutes extracting the same packages.
      - name: Build UI
        run: make web
      - name: Frontend and package tests
        run: make test-js
      - name: Upload embedded UI
        uses: actions/upload-artifact@v7
        with:
          name: picode-ui
          path: internal/web/public/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 1
          compression-level: 1

  docs:
    name: Public docs
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "stable"
          cache: true
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: docs-site/package-lock.json

      # Check committed parity before `make docs` regenerates OpenAPI/llms.txt.
      # Tutorial videos get a hash-only integrity check here; capture/render and
      # the strict UI-tree freshness audit are explicit maintenance commands.
      - name: Docs parity
        run: make docs-check
      - name: Build public docs
        run: make docs
      - name: Prose lint (Vale)
        run: make vale

  go:
    name: Go (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.full == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.changes.outputs.os) }}
    steps:
      - uses: actions/checkout@v7

      # Ubuntu 24.04 packages tmux 3.4, but PiCode's extended-keys-format
      # contract starts at 3.5. Test the declared minimum instead of silently
      # skipping that integration path. The release tarball is checksum-pinned;
      # the built tree is cached so the compile runs once per runner image.
      - name: Cache the tmux 3.5a build
        if: matrix.os == 'ubuntu-latest'
        id: tmux-cache
        uses: actions/cache@v4
        with:
          path: /tmp/tmux-3.5a
          key: tmux-3.5a-${{ runner.os }}-${{ runner.arch }}-v1
      - name: Build tmux 3.5a
        if: matrix.os == 'ubuntu-latest' && steps.tmux-cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y bison libevent-dev libncurses-dev
          curl -fsSL --retry 3 \
            https://github.com/tmux/tmux/releases/download/3.5a/tmux-3.5a.tar.gz \
            -o /tmp/tmux-3.5a.tar.gz
          echo "16216bd0877170dfcc64157085ba9013610b12b082548c7c9542cc0103198951  /tmp/tmux-3.5a.tar.gz" | sha256sum -c -
          tar -xzf /tmp/tmux-3.5a.tar.gz -C /tmp
          cd /tmp/tmux-3.5a
          ./configure
          make -j2
      - name: Install tmux 3.5a (integration tests)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libevent-dev libncurses-dev
          cd /tmp/tmux-3.5a && sudo make install
          test "$(tmux -V)" = "tmux 3.5a"

      # The daemon runs on macOS too; Homebrew's tmux satisfies the >= 3.5
      # contract, so the handoff and terminal suites run for real there
      # instead of answering 503 "Install tmux" (2026-09-09).
      - name: Install tmux (macOS)
        if: matrix.os == 'macos-latest'
        run: brew install tmux && tmux -V

      # The suites start tmux from several packages at once on a fresh runner;
      # two clients racing to start the first server leave one of them with
      # "server exited unexpectedly" (TestBridgeResizeControl, 2026-09-09).
      # A detached session keeps one server alive for the whole run — the
      # state every developer machine is already in.
      - name: Keep a tmux server alive for the daemon suite
        if: matrix.os != 'windows-latest'
        run: tmux new-session -d -s ci-keepalive && tmux list-sessions

      - uses: actions/setup-go@v7
        with:
          # Not 'go-version-file': macOS arm64 runners hit golang/go#67629
          # (missing LC_UUID) with -race on old toolchains; go.mod stays at
          # the minimum (1.22), CI builds with a current stable toolchain.
          go-version: "stable"
          cache: true

      - name: Format check
        if: matrix.os == 'ubuntu-latest'
        run: make fmt-check

      # The worktree guards read /proc, so this policy matrix runs on Linux.
      - name: Git guard self-test
        if: matrix.os == 'ubuntu-latest'
        run: ./scripts/hooks-selftest.sh

      - name: Vet
        run: go vet ./...

      # The daemon runs on Linux/macOS (inside WSL on Windows). Windows still
      # compiles every package and test with the race toolchain, then executes
      # the native tray/native-host boundary. Running the Linux daemon suite
      # against Windows path and permission semantics tests an unsupported
      # topology rather than the shipped Windows product (ADR-0020).
      - name: Test daemon
        if: matrix.os != 'windows-latest'
        run: go test -race ./...

      - name: Compile Windows packages and tests
        if: matrix.os == 'windows-latest'
        run: go test -race -run '^$' ./...

      - name: Test Windows host boundary
        if: matrix.os == 'windows-latest'
        run: go test -race ./cmd/picode ./cmd/picode-desktop ./internal/binwatch ./internal/browserhost ./internal/desktop ./internal/osopen ./internal/version

  embedded:
    name: Embedded UI build
    needs: [changes, frontend]
    if: needs.changes.outputs.full == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "stable"
          cache: true
      - name: Download embedded UI
        uses: actions/download-artifact@v8
        with:
          name: picode-ui
          path: internal/web/public
      - name: Test and build embedded UI
        run: |
          test -f internal/web/public/index.html
          test -f internal/web/public/desktop/index.html
          test -f internal/web/public/mobile/index.html
          go test -tags embedui ./internal/web
          mkdir -p bin
          go build -tags embedui -o bin/picode ./cmd/picode

  gate:
    name: CI gate
    if: always()
    needs: [changes, frontend, docs, go, embedded]
    runs-on: ubuntu-latest
    steps:
      - name: Require every applicable gate
        shell: bash
        env:
          CHANGES: ${{ needs.changes.result }}
          FRONTEND: ${{ needs.frontend.result }}
          DOCS: ${{ needs.docs.result }}
          GO: ${{ needs.go.result }}
          EMBEDDED: ${{ needs.embedded.result }}
        run: |
          failed=0
          for gate in CHANGES FRONTEND DOCS GO EMBEDDED; do
            result="${!gate}"
            printf '%-10s %s\n' "$gate" "$result"
            case "$result" in
              success|skipped) ;;
              *) failed=1 ;;
            esac
          done
          exit "$failed"
