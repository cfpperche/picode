name: Release

# Tagging is the trigger, so a release is always a commit someone chose.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (must already exist)"
        required: true

permissions:
  contents: write

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/setup-go@v5
        with:
          go-version: "stable"
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      # cargo-xwin shells out to llvm-rc and clang-cl. Debian's clang has no
      # clang-cl under any name, but clang selects its MSVC driver from
      # argv[0], so a symlink is the real thing (proven on a fresh Ubuntu
      # 24.04 container, 2026-09-15). cargo-xwin is pinned: a surprise major
      # must never be what breaks a release build.
      - name: Provision the shell toolchain
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y llvm clang
          for tool in llvm-rc clang-cl; do
            if command -v "$tool" >/dev/null; then continue; fi
            found="$(ls /usr/bin 2>/dev/null | grep -E "^${tool}-[0-9]+$" | sort -V | tail -n 1 || true)"
            if [[ -n "$found" ]]; then sudo ln -sf "/usr/bin/$found" "/usr/local/bin/$tool"; continue; fi
            if [[ "$tool" == "clang-cl" ]]; then sudo ln -sf "$(command -v clang)" /usr/local/bin/clang-cl; continue; fi
            echo "missing $tool" >&2; exit 1
          done
          cargo install cargo-xwin --version 0.23.1
          cargo xwin --version

      - name: Resolve version
        id: v
        run: |
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

      - name: Validate release notes
        run: node scripts/release-notes.mjs "${{ steps.v.outputs.version }}" --check

      # The UI is embedded with go:embed, so it has to exist before any
      # binary is built — once, for every platform.
      - name: Build UI
        run: cd web && npm ci && npm run build

      # Asset names are a contract: internal/install.assetName() looks for
      # exactly picode-<goos>-<goarch>, and that is what `picode update`
      # downloads. Renaming these breaks self-update for every install.
      - name: Build binaries
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p dist
          ldflags="-s -w -X github.com/cfpperche/picode/internal/version.Version=${VERSION} -X github.com/cfpperche/picode/internal/version.Stamped=release"

          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64; do
            goos="${target%/*}"; goarch="${target#*/}"
            echo "building picode-${goos}-${goarch}"
            CGO_ENABLED=0 GOOS="$goos" GOARCH="$goarch" \
              go build -trimpath -tags embedui -ldflags "$ldflags" \
              -o "dist/picode-${goos}-${goarch}" ./cmd/picode
          done

          # PiCode Desktop is Windows-only and links as a GUI app, so no
          # console window flashes when the logon task starts it.
          echo "building picode-desktop-windows-amd64.exe"
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 \
            go build -trimpath -ldflags "$ldflags -H=windowsgui" \
            -o dist/picode-desktop-windows-amd64.exe ./cmd/picode-desktop

          # The shell ships in the same tag (ADR-0142): the tool and the
          # resident never disagree about the version, and `update`
          # refreshes both or neither. Tauri needs a three-part version;
          # a two-part tag would fail the build instead of shipping.
          echo "building picode-shell-windows-amd64.exe"
          shell_version="$VERSION"
          [[ "$shell_version" =~ ^[0-9]+\.[0-9]+$ ]] && shell_version="$shell_version.0"
          sed -i "s/^version = \".*\"/version = \"${shell_version}\"/" desktop-shell/Cargo.toml
          sed -i "s/\"version\": \".*\"/\"version\": \"${shell_version}\"/" desktop-shell/tauri.conf.json
          make desktop-shell
          cp desktop-shell/target/x86_64-pc-windows-msvc/release/picode-shell.exe \
            dist/picode-shell-windows-amd64.exe

          (cd dist && sha256sum * > SHA256SUMS)
          ls -lh dist

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.v.outputs.tag }}
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          set -euo pipefail
          notes_file="$(mktemp)"
          trap 'rm -f "$notes_file"' EXIT
          node scripts/release-notes.mjs "$VERSION" > "$notes_file"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
            gh release edit "$TAG" --notes-file "$notes_file"
          else
            gh release create "$TAG" dist/* \
              --title "$TAG" \
              --notes-file "$notes_file"
          fi
